<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ora Analoge — Erion Nezha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 30%,#16202e,#070b12 75%);color:#e8eef5;
  font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:1.5rem;letter-spacing:2px;margin-bottom:4px;color:#fff}
.sub{color:#8fa3b8;font-size:.9rem;margin-bottom:14px}
.clockwrap{position:relative}
canvas{max-width:min(92vw,480px);max-height:60vh;width:auto;height:auto;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.digital{margin-top:14px;font-size:2rem;font-weight:600;letter-spacing:3px;color:#7fdbff;font-variant-numeric:tabular-nums}
.date{color:#8fa3b8;margin-top:4px;font-size:.95rem;text-transform:capitalize}
footer{margin-top:18px;color:#5c6b7f;font-size:.82rem}
footer strong{color:#9fb3c8}
</style>
</head>
<body>
<h1>🕐 ORA ANALOGE</h1>
<div class="sub">Tregon orën reale të pajisjes tënde — akrepat lëvizin live</div>
<div class="clockwrap"><canvas id="canvas" width="600" height="600"></canvas></div>
<div class="digital" id="digital">--:--:--</div>
<div class="date" id="date"></div>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026</footer>
<script>
(function(){
"use strict";
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var radius=canvas.height/2;
ctx.translate(radius,radius);
radius=radius*0.90;
function drawClock(){drawFace(ctx,radius);drawNumbers(ctx,radius);drawTime(ctx,radius);}
function drawFace(ctx,radius){
  var grad;
  ctx.beginPath();ctx.arc(0,0,radius,0,2*Math.PI);ctx.fillStyle="#fdfdfd";ctx.fill();
  grad=ctx.createRadialGradient(0,0,radius*0.95,0,0,radius*1.05);
  grad.addColorStop(0,'#333');grad.addColorStop(0.5,'white');grad.addColorStop(1,'#333');
  ctx.strokeStyle=grad;ctx.lineWidth=radius*0.1;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,radius*0.1,0,2*Math.PI);ctx.fillStyle='#333';ctx.fill();
}
function drawNumbers(ctx,radius){
  var ang,num;
  ctx.font=radius*0.15+"px arial";ctx.textBaseline="middle";ctx.textAlign="center";ctx.fillStyle="#222";
  for(num=1;num<13;num++){
    ang=num*Math.PI/6;ctx.rotate(ang);ctx.translate(0,-radius*0.85);ctx.rotate(-ang);
    ctx.fillText(num.toString(),0,0);
    ctx.rotate(ang);ctx.translate(0,radius*0.85);ctx.rotate(-ang);
  }
  for(var m=0;m<60;m++){ // shenjat e minutave
    var a=m*Math.PI/30;ctx.save();ctx.rotate(a);
    ctx.fillStyle=m%5===0?'#333':'#bbb';
    ctx.fillRect(-radius*0.008,-radius*0.97,radius*0.016,radius*(m%5===0?0.06:0.035));
    ctx.restore();
  }
}
function drawHand(ctx,pos,length,width,color){
  ctx.beginPath();ctx.lineWidth=width;ctx.lineCap="round";ctx.strokeStyle=color||"#222";
  ctx.moveTo(0,0);ctx.rotate(pos);ctx.lineTo(0,-length);ctx.stroke();ctx.rotate(-pos);
}
function drawTime(ctx,radius){
  var now=new Date();
  var hour=now.getHours(),minute=now.getMinutes(),second=now.getSeconds(),ms=now.getMilliseconds();
  var hAng=((hour%12)*Math.PI/6)+(minute*Math.PI/(6*60))+(second*Math.PI/(360*60));
  drawHand(ctx,hAng,radius*0.5,radius*0.07);
  var mAng=(minute*Math.PI/30)+(second*Math.PI/(30*60));
  drawHand(ctx,mAng,radius*0.8,radius*0.07);
  var sAng=((second+ms/1000)*Math.PI/30);
  drawHand(ctx,sAng,radius*0.9,radius*0.02,"#d43d3d");
  var d=document.getElementById('digital');
  function p(n){return (n<10?'0':'')+n;}
  d.textContent=p(hour)+':'+p(minute)+':'+p(second);
  document.getElementById('date').textContent=now.toLocaleDateString('sq-AL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
drawClock();
setInterval(drawClock,50); // 50ms për lëvizje të butë të akrepit të sekondave
})();
</script>
</body>
</html>
